[project]
name = "cluelink-backend"
version = "0.1.0"
description = "Cluelink gameplay API"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "domain",
]

[project.scripts]
cluelink-api = "backend.main:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"

[tool.uv.sources]
domain = { workspace = true }
