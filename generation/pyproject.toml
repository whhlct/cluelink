[project]
name = "cluelink-generation"
version = "0.1.0"
description = "Cluelink puzzle generation"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "cluelink-backend",
]

[project.scripts]
cluelink-generate = "generation.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "generation"

[tool.uv.sources]
cluelink-backend = { workspace = true }
